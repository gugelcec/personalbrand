:root{
    --primary:#7c3aed;
    --secondary:#06b6d4;
    --accent:#f97316;
    --pink:#ec4899;
    --light:#f8fafc;
    --dark:#0f172a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    overflow-x:hidden;
}

/* Animated Background */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(100px);
    z-index:-1;
}

body::before{
    width:400px;
    height:400px;
    background:#7c3aed;
    top:-100px;
    left:-100px;
    opacity:.45;
}

body::after{
    width:500px;
    height:500px;
    background:#06b6d4;
    bottom:-200px;
    right:-150px;
    opacity:.35;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

/* Navigation */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 0;
}

.logo{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:1px;
}

nav ul{
    display:flex;
    gap:25px;
    list-style:none;
}

nav a{
    color:white;
    text-decoration:none;
}

/* Hero */

.hero{
    min-height:85vh;
    display:grid;
    grid-template-columns:1.2fr .8fr;
    align-items:center;
    gap:60px;
}

.hero-text h1{
    font-size:4.5rem;
    line-height:1;
    margin-bottom:15px;
}

.gradient-text{
    background:linear-gradient(90deg,#06b6d4,#ec4899,#f97316);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text p{
    font-size:1.2rem;
    color:#cbd5e1;
    line-height:1.8;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:50px;
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    text-decoration:none;
    color:white;
    font-weight:600;
}

/* Profile Card */

.profile-card{
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    padding:35px;
    text-align:center;
}

.avatar{
    width:180px;
    height:180px;
    border-radius:50%;
    background:linear-gradient(135deg,#06b6d4,#ec4899);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:5rem;
    margin:auto auto 20px;
}

.profile-card h3{
    font-size:1.8rem;
    margin-bottom:10px;
}

.profile-card p{
    color:#cbd5e1;
}

/* Sections */

section{
    padding:100px 0;
}

.section-title{
    text-align:center;
    font-size:3rem;
    margin-bottom:60px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
